name: FDA 510(k) watch

on:
  schedule:
    # 13:00 UTC = 9am EDT / 8am EST. Adjust to 14:00 for 9am EST in winter.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fda-510k-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check openFDA and download new summaries
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python fda_510k_watch.py

      - name: Commit new state and summaries
        run: |
          git config user.name "fda-510k-watch[bot]"
          git config user.email "fda-510k-watch@users.noreply.github.com"
          git add state summaries
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "FDA 510(k) watch: $(date -u +%Y-%m-%d)"
            git push
          fi
